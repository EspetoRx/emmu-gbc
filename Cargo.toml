[package]
name = "emmu-gbc"
version = "0.1.0"
edition = "2024"
description = "Emmu Game Boy / Game Boy Color core"
repository = "https://github.com/EspetoRx/emmu-gbc"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

# O núcleo de emulação (oxGBC) é vendorizado dentro deste crate, em
# `vendor/oxgbc-core`. Nenhum pacote de emulação fica fora da pasta do módulo.
[dependencies]
oxgbc-core = { path = "vendor/oxgbc-core" }
serde_json = "1"
wasm-bindgen = "0.2"
